name: validate

on:
  push:
  pull_request:

jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: validate rosters
        run: npx --yes @stofone/dsh-agent-roster@latest validate --dir rosters
      - name: validate registry
        run: npx --yes @stofone/dsh-agent-roster@latest registry validate --file registry.json
